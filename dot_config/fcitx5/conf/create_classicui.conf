# fcitx5 candidate-popup appearance.
#
# Managed as a chezmoi `create_` file: fcitx5-configtool rewrites it in place.

[Classic User Interface]
# The default "Sans 10" is unreadably small for hanzi, which need far more
# pixels than latin to stay distinguishable (识 vs 织 at 10pt is a coin flip).
Font="Noto Sans CJK SC 14"
MenuFont="Noto Sans CJK SC 13"
TrayFont="Noto Sans CJK SC Bold 12"

# eDP-1 runs at scale 1.5 (see hypr/hyprland/monitors.lua). PerScreenDPI applies
# that factor to the popup on top of the point sizes above.
PerScreenDPI=True

# Vertical list gives each candidate its own row, so the numbered picks are
# easier to hit than in the default cramped horizontal strip.
Vertical Candidate List=True

Theme=default
UseInputMethodLanguageToDisplayText=True
