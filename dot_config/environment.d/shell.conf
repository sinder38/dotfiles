SHELL=/usr/bin/fish
GTK_THEME=Adwaita:dark
QT_QPA_PLATFORMTHEME=qt6ct
ELECTRON_OZONE_PLATFORM_HINT=auto

# Chinese input via fcitx5. Wayland-native GTK/Qt/Electron apps talk to fcitx5
# over text-input-v3 and break if GTK_IM_MODULE/QT_IM_MODULE are forced, so only
# the non-Wayland paths are set here: XMODIFIERS for XWayland (Steam, wine,
# older toolkits), and the SDL/GLFW hints for games. GLFW's fcitx support is
# routed through its ibus backend, hence the value below.
XMODIFIERS=@im=fcitx
SDL_IM_MODULE=fcitx
GLFW_IM_MODULE=ibus

# Android SDK lives in the Studio-managed tree, not the AUR /opt/android-sdk one.
# Gradle and the emulator both read ANDROID_HOME; ANDROID_SDK_ROOT is the older
# name some tooling still looks for.
ANDROID_HOME=%h/Android/Sdk
ANDROID_SDK_ROOT=%h/Android/Sdk
ANDROID_AVD_HOME=%h/.android/avd
